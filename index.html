<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariana Rufo — Página Pessoal</title>
  <style>
    :root {
      --bg: #f7f6f2; --surface: #ffffff; --text: #20232b;
      --muted: #5b6070; --accent: #4c5c96; --border: #e2e0d8;
    }
    [data-theme="dark"] {
      --bg: #14161b; --surface: #1b1e24; --text: #ecece4;
      --muted: #a7abba; --accent: #8d97d6; --border: #2a2d35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem;
    }
    .card {
      max-width: 560px;
      text-align: center;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: 600;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: block;
      padding: 0.9rem 1.6rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mariana Laura Gonçalves Campos Rufo</h1>
    <p class="subtitle">Página pessoal — Atividade Prática 2, GAC116 Programação Web</p>
    <div class="links">
      <a href="bootstrap/index.html">Versão com Bootstrap</a>
      <a href="outro-framework/index.html">Versão com Bulma</a>
    </div>
  </div>
</body>
</html>
